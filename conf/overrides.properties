# =====================================================================
# conf/overrides.properties  —  environment: UAT  (branch: uat)
# ---------------------------------------------------------------------
# Applied to the BAR by the pipeline:
#   ibmint apply overrides conf/overrides.properties \
#     --input-bar-file <built.bar> --output-bar-file <env.bar>
#
# RULES
#  - Every environment branch (develop, qa, uat) has the SAME keys.
#    Only the values differ.
#  - Key format:  <flow>#<UDP>  or  <flow>#<node>.<property>
#  - NEVER put passwords, tokens or keys here (use GitHub Environment secrets).
# =====================================================================

# Flow user-defined properties (read by ESQL EXTERNAL variables)
HelloFlow#envName=UAT
HelloFlow#greeting=Hello from UAT

# Node property: seconds the HTTP Input node waits for a reply
HelloFlow#HTTP Input.timeoutForClient=120

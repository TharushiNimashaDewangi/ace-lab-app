# LAB: learning workflow — now runs on the self-hosted Mac runner and builds a real BAR.
# Will be replaced by the real caller workflows (pr.yml, deploy.yml) later.
name: Hello Actions

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [develop]       # also runs on every push/merge to develop
  pull_request:
    branches: [develop]       # and on PRs into develop

env:
  ACE_IMAGE: ibmint13:13.0.9.0
  ACE_IMAGE_ID: sha256:9c407459cfb2789d4c9fcdf75638dab78b21e71c03e78c1ea749ea7b485f6462

jobs:
  hello:
    runs-on: [self-hosted, ace-lab]     # only the Mac runner has these labels
    steps:
      - uses: actions/checkout@v4

      - name: Show what the pipeline sees
        run: |
          echo "Runner : $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          echo "Branch : ${{ github.ref_name }}"
          echo "Event  : ${{ github.event_name }}"
          echo "Commit : ${{ github.sha }}"

      - name: Verify pinned ibmint image (audit)
        run: |
          ACTUAL=$(docker image inspect "$ACE_IMAGE" --format '{{.Id}}')
          echo "expected $ACE_IMAGE_ID"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$ACE_IMAGE_ID" ] || { echo "::error::ibmint image drift on this runner"; exit 1; }

      - name: Package BAR and apply this branch's overrides (ibmint in Docker)
        run: |
          mkdir -p build && chmod 777 build
          docker run --rm --platform linux/amd64 --entrypoint bash \
            -v "$PWD":/src:ro -v "$PWD/build":/out "$ACE_IMAGE" -c '
              set -e
              . /opt/ibm/ace-13/server/bin/mqsiprofile >/dev/null
              ibmint package --input-path /src --project LabHelloAPI --output-bar-file /out/LabHelloAPI.bar
              ibmint apply overrides /src/conf/overrides.properties \
                --input-bar-file /out/LabHelloAPI.bar --output-bar-file /out/LabHelloAPI-env.bar
              mqsireadbar -b /out/LabHelloAPI-env.bar -r | grep -E "envName|greeting|timeoutForClient"'

      - name: Record checksum
        run: shasum -a 256 build/LabHelloAPI-env.bar | tee build/LabHelloAPI-env.bar.sha256
